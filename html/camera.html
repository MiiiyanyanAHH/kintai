<!DOCTYPE html>
<html lang="jp">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/camera.css">
  <title>QR読み取り画面</title>
</head>

<body>
  <h1 id="title">勤怠管理システム　きんたくん</h1>
  <h2 id="subtitle">QRコードをかざしてください</h2>
  <div id="wrapper">
    <!--QR読み込みのためのカメラ映像を表示するvideo要素-->
    <video id="video" autoplay muted playsinline></video>
    <!--要素をもとにカメラ映像を表示するcanvas要素-->
    <canvas id="camera-canvas"></canvas>
    <!--QRコードの周りに赤枠を表示するためのcanvas要素-->
    <canvas id="rect-canvas"></canvas>
    <span id="qr-msg">QRコード:が見つかりません</span>
  </div>
  <script src="../js/jsQR.js"></script>
  <script src="../js/qr.js"></script>
</body>

</html>
